[platform]
project_prefix = "user-"
max_containers = 3
slot_key = "user.incus-only.slot"
management_key = "user.incus-only.management_id"
users_file = "/etc/incus-only-shell/users.toml"
incus_conf = "/etc/incus-only-shell/client"

[network]
# Host/site-specific policy lives here, not in the Python source.
nat_device = "eth0"
ipv4_prefix = "10.100"
service_slots = 10
